<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="単語カード">
<meta name="theme-color" content="#4f46e5">
<title>英単語カード</title>
<style>
  :root{
    --bg:#0f1226; --card:#1c1f3a; --card2:#262a4d; --accent:#6366f1;
    --accent2:#22d3ee; --text:#eef0ff; --sub:#a4a9d4; --gold:#fbbf24; --line:#2e3358;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#0f1226,#141a36); color:var(--text);
    display:flex; flex-direction:column; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px; position:sticky; top:0;
    background:linear-gradient(180deg,rgba(15,18,38,.96),rgba(15,18,38,.7)); backdrop-filter:blur(8px); z-index:5;
  }
  header h1{font-size:19px; margin:0; letter-spacing:.5px;}
  header h1 span{color:var(--accent2);}
  .toolbar{display:flex; gap:8px;}
  .iconbtn{
    background:var(--card2); border:none; color:var(--text); width:40px; height:40px;
    border-radius:12px; font-size:18px; display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn.active{background:var(--accent);}
  .stats{padding:0 18px 6px; color:var(--sub); font-size:13px; display:flex; gap:14px;}
  .stats b{color:var(--text);}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 18px 0;}

  .scene-wrap{position:relative; width:100%; max-width:440px;}
  .scene{width:100%; height:58vh; max-height:520px; perspective:1400px;}
  .starOverlay{
    position:absolute; top:14px; right:16px; font-size:30px; line-height:1;
    background:none; border:none; color:#3a3f6b; z-index:6; cursor:pointer; padding:0;
  }
  .starOverlay.on{color:var(--gold);}
  .card{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.2,1); cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px;
    background:linear-gradient(155deg,var(--card),var(--card2));
    border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.45);
    padding:24px; display:flex; flex-direction:column; overflow:hidden;
  }
  .back{transform:rotateY(180deg);}
  .front{align-items:center; justify-content:center; text-align:center;}
  .word{font-size:42px; font-weight:700; line-height:1.1; word-break:break-word;}
  .pos{color:var(--sub); margin-top:10px; font-size:15px;}
  .hint{position:absolute; bottom:16px; left:0; right:0; text-align:center; color:var(--sub); font-size:12px;}

  .img{width:100%; height:230px; border-radius:16px; object-fit:contain; margin-bottom:8px; background:#0d1024; display:block;}
  .emoji-img{font-size:120px; text-align:center; height:230px; line-height:230px;}
  .back .scroll{overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; padding-bottom:18px;}
  .back .ja{font-size:26px; font-weight:700; margin:8px 0 4px;}
  .field{margin-top:12px;}
  .field .label{font-size:12px; color:var(--accent2); font-weight:700; letter-spacing:.5px; text-transform:uppercase;}
  .field .val{font-size:15px; margin-top:3px; line-height:1.5; color:var(--text); white-space:pre-wrap;}
  .field .val.empty{color:#5b6092; font-style:italic;}
  .dates{margin-top:14px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--sub);}

  .nav{display:flex; align-items:center; gap:18px; margin-top:16px;}
  .nav button{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    width:54px; height:54px; border-radius:50%; font-size:22px; cursor:pointer;
  }
  .nav button:active{transform:scale(.94);}
  .counter{min-width:84px; text-align:center; color:var(--sub); font-size:14px;}

  .empty-state{text-align:center; color:var(--sub); padding:40px;}
  .empty-state .big{font-size:54px;}
  .empty-state button{margin-top:16px;}

  .primary{
    background:linear-gradient(135deg,var(--accent),#818cf8); color:#fff; border:none;
    padding:13px 22px; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer;
  }

  .overlay{position:fixed; inset:0; background:rgba(5,7,20,.7); backdrop-filter:blur(4px); display:none; align-items:flex-end; justify-content:center; z-index:20;}
  .overlay.show{display:flex;}
  .sheet{width:100%; max-width:520px; background:var(--card); border-radius:24px 24px 0 0; border-top:1px solid var(--line); max-height:92vh; overflow-y:auto; animation:up .25s ease; display:flex; flex-direction:column;}
  .sheet-body{padding:20px 18px 6px;}
  @keyframes up{from{transform:translateY(40px); opacity:.4;} to{transform:none; opacity:1;}}
  .sheet h2{margin:4px 0 16px; font-size:19px;}
  label.lbl{display:block; font-size:13px; color:var(--sub); margin:14px 0 5px;}
  input,textarea,select{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; font-size:16px; font-family:inherit; resize:vertical;}
  textarea{min-height:58px;}
  .imgrow{display:flex; gap:8px; align-items:stretch;}
  .imgrow input{flex:1;}
  .clearbtn{background:var(--card2); border:1px solid var(--line); color:var(--sub); width:48px; border-radius:12px; font-size:20px; cursor:pointer;}
  .clearbtn:active{background:#3a1d2a; color:#fda4af;}
  .sheet-actions{display:flex; gap:10px; padding:12px 18px calc(14px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); z-index:2;}
  .sheet-actions button{flex:1; padding:14px; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; border:none;}
  .cancel{background:var(--card2); color:var(--text);}
  .hint-sm{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5;}
  .imgpreview{width:100%; height:130px; object-fit:cover; border-radius:12px; margin-top:8px; display:none; background:var(--card2);}
  .imgpreview.show{display:block;}
  .ghost{background:var(--card2); color:var(--text); border:1px solid var(--line); padding:11px; border-radius:11px; font-size:14px; cursor:pointer; margin-top:8px; width:100%;}
  .ghost.active{background:var(--accent); color:#fff; border-color:transparent;}
  .ghost:active{background:var(--accent);}

  .listview{display:none; width:100%; max-width:520px; margin:0 auto;}
  .listview.show{display:block;}
  .lc{display:flex; gap:8px; margin:0 4px 10px;}
  .lcbtn{flex:1; padding:9px 4px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--sub); font-size:13px; cursor:pointer;}
  .lcbtn.on{background:var(--accent); color:#fff; border-color:transparent;}
  .sortbar{margin:0 4px 10px;}
  .sortbar select{width:100%;}
  .listitem{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer;}
  .listitem .li-emoji{font-size:24px; width:28px; text-align:center;}
  .listitem .li-w{font-weight:600; font-size:16px;}
  .listitem .li-j{color:var(--sub); font-size:13px;}
  .listitem .li-act{font-size:18px; color:#9aa0d4; padding:4px 3px;}
  .listitem .li-star{font-size:18px; color:#3a3f6b; padding:4px;}
  .listitem .li-star.on{color:var(--gold);}
  .cardtools{display:flex; gap:8px; margin-top:12px; width:100%; max-width:440px;}
  .cardtools .ghost{margin-top:0; flex:1; width:auto; padding:10px 4px; font-size:14px;}
</style>
</head>
<body>
<header>
  <h1>英単語<span>カード</span></h1>
  <div class="toolbar">
    <button class="iconbtn" id="listBtn" title="一覧">≡</button>
    <button class="iconbtn" id="addBtn" title="追加">＋</button>
  </div>
</header>
<div class="stats">
  <span>全 <b id="totalCount">0</b> 語</span>
  <span>マーク <b id="favCount">0</b></span>
  <span id="modeLabel"></span>
</div>

<main>
  <div id="cardArea" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="scene-wrap">
      <div class="scene">
        <div class="card" id="card">
          <div class="face front">
            <div class="word" id="frontWord">—</div>
            <div class="pos" id="frontPos"></div>
            <div class="hint">タップで意味を表示</div>
          </div>
          <div class="face back">
            <div class="scroll">
              <img class="img" id="backImg" alt="" style="display:none;">
              <div class="emoji-img" id="backEmoji" style="display:none;"></div>
              <div class="ja" id="backJa"></div>
              <div class="field"><div class="label">メモ</div><div class="val" id="fMemo"></div></div>
              <div class="field"><div class="label">語源</div><div class="val" id="fEty"></div></div>
              <div class="field"><div class="label">類似語</div><div class="val" id="fSyn"></div></div>
              <div class="field"><div class="label">イディオム</div><div class="val" id="fIdiom"></div></div>
              <div class="field"><div class="label">例文</div><div class="val" id="fEx"></div></div>
              <div class="dates" id="cardDates"></div>
            </div>
            <div class="hint">タップで戻る・長押しで編集</div>
          </div>
        </div>
      </div>
      <button class="starOverlay" id="starBtn">★</button>
    </div>
    <div class="nav">
      <button id="prevBtn">‹</button>
      <div class="counter" id="counter">0 / 0</div>
      <button id="nextBtn">›</button>
    </div>
    <div class="cardtools">
      <button class="ghost" id="favBtn" title="マークのみ表示">★</button>
      <button class="ghost" id="shuffleBtn" title="シャッフル">🔀</button>
      <button class="ghost" id="editCur" title="編集">✎ 編集</button>
      <button class="ghost" id="archCur" title="アーカイブ">🗄</button>
    </div>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">📚</div>
    <p>まだ単語がありません。<br>「＋」から追加しましょう。</p>
    <button class="primary" id="emptyAdd">単語を追加</button>
  </div>

  <div class="listview" id="listView"></div>
</main>

<!-- 追加メニュー -->
<div class="overlay" id="addMenu">
  <div class="sheet">
    <div class="sheet-body">
      <h2>追加方法を選ぶ</h2>
      <button class="primary" id="menuManual" style="width:100%; margin-bottom:10px;">✏️ 手動で追加</button>
      <button class="ghost" id="menuImport" style="margin-top:0;">📷 写真から読み取って追加</button>
    </div>
    <div class="sheet-actions"><button class="cancel" id="menuCancel">キャンセル</button></div>
  </div>
</div>

<!-- 追加/編集 -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-body">
      <h2 id="sheetTitle">単語を追加</h2>

      <label class="lbl">英単語 *</label>
      <input id="inWord" placeholder="例: serendipity" autocapitalize="off" autocomplete="off">
      <div class="hint-sm" id="fetchStatus">英単語を入力すると、発音・語源・類似語・例文・画像を自動取得します。</div>

      <label class="lbl">日本語の意味 *</label>
      <textarea id="inJa" placeholder="自分で入力してください"></textarea>

      <label class="lbl">メモ（任意）</label>
      <textarea id="inMemo" placeholder="覚え方やイメージなど、自由にメモ"></textarea>

      <label class="lbl">画像</label>
      <div class="imgrow">
        <input id="inImg" placeholder="画像URL（自動取得されます）" autocapitalize="off">
        <button class="clearbtn" id="clearImg" title="画像を消す">×</button>
      </div>
      <img class="imgpreview" id="imgPreview" alt="">
      <button class="ghost" id="lkGimg">🖼️ Google画像検索で探す</button>

      <label class="lbl">発音</label>
      <input id="inPos" placeholder="例: /ˌserənˈdipədi/">

      <label class="lbl">語源</label>
      <textarea id="inEty"></textarea>

      <label class="lbl">類似語</label>
      <textarea id="inSyn"></textarea>

      <label class="lbl">イディオム / 関連表現</label>
      <textarea id="inIdiom"></textarea>

      <label class="lbl">例文</label>
      <textarea id="inEx"></textarea>
    </div>

    <div class="sheet-actions">
      <button class="cancel" id="cancelBtn">キャンセル</button>
      <button class="primary" id="saveBtn" style="flex:1.4;">保存</button>
    </div>
  </div>
</div>

<!-- 写真から取り込み -->
<div class="overlay" id="importOverlay">
  <div class="sheet">
    <div class="sheet-body">
      <h2>📷 写真から読み取り</h2>
      <input type="file" id="impFile" accept="image/*">
      <div class="hint-sm" id="impStatus" style="margin-top:8px;"></div>
      <img id="impPreview" alt="" style="display:none; width:100%; border-radius:12px; margin-top:10px; border:1px solid var(--line);">
      <label class="lbl">読み取り結果（編集できます）</label>
      <textarea id="impText" style="min-height:180px;" placeholder="例：&#10;apple ＝ りんご&#10;run ＝ 走る"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="cancel" id="impCancel">キャンセル</button>
      <button class="primary" id="impCommit" style="flex:1.4;">リストに追加</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const STORE_KEY="vocab_cards_v1", SORT_KEY="vocab_sort", OCRKEY_KEY="vocab_ocr_key";
let cards=[], idx=0, editId=null, favOnly=false, listMode=false, archMode=false, sortMode="created_desc";

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function load(){
  try{ cards=JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ cards=[]; }
  sortMode=localStorage.getItem(SORT_KEY)||"created_desc";
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(cards)); }
function fmtDate(ts){ if(!ts) return "—"; const d=new Date(ts); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }

function active(){ return cards.filter(c=>!c.arch); }
function view(){ const b=active(); return favOnly? b.filter(c=>c.fav): b; }
function sortList(list){
  const a=[...list];
  if(sortMode==="alpha") a.sort((x,y)=>(x.word||"").toLowerCase().localeCompare((y.word||"").toLowerCase()));
  else if(sortMode==="created_asc") a.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
  else if(sortMode==="studied_desc") a.sort((x,y)=>(y.lastStudied||0)-(x.lastStudied||0));
  else a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
  return a;
}

function render(){
  const list=view();
  $("totalCount").textContent=active().length;
  $("favCount").textContent=active().filter(c=>c.fav).length;
  $("favBtn").classList.toggle("active", favOnly);
  $("listBtn").classList.toggle("active", listMode||archMode);

  if(archMode){
    $("modeLabel").textContent="アーカイブ";
    $("cardArea").style.display="none"; $("emptyState").style.display="none";
    renderArchive(); $("listView").classList.add("show"); return;
  }
  $("modeLabel").textContent=favOnly?"★マークのみ":"";

  if(listMode){
    $("cardArea").style.display="none"; $("emptyState").style.display="none";
    renderList(list); $("listView").classList.add("show"); return;
  }
  $("listView").classList.remove("show");

  if(list.length===0){ $("cardArea").style.display="none"; $("emptyState").style.display="block"; return; }
  $("emptyState").style.display="none"; $("cardArea").style.display="flex";

  if(idx>=list.length) idx=list.length-1;
  if(idx<0) idx=0;
  const c=list[idx];
  $("card").classList.remove("flipped");
  $("frontWord").textContent=c.word;
  $("frontPos").textContent=c.pos||"";
  $("backJa").textContent=c.ja||"";
  setField("fMemo", c.memo);
  setField("fEty", c.ety);
  setField("fSyn", c.syn);
  setField("fIdiom", c.idiom);
  setField("fEx", c.ex);
  $("cardDates").textContent="登録日: "+fmtDate(c.createdAt)+" ／ 最終学習: "+fmtDate(c.lastStudied);

  const img=$("backImg"), em=$("backEmoji");
  if(c.img){ img.src=c.img; img.style.display="block"; em.style.display="none"; }
  else if(c.emoji){ em.textContent=c.emoji; em.style.display="block"; img.style.display="none"; }
  else { img.style.display="none"; em.style.display="none"; }

  $("starBtn").classList.toggle("on", !!c.fav);
  $("counter").textContent=(idx+1)+" / "+list.length;
}
function setField(id,v){ const el=$(id); if(v&&v.trim()){ el.textContent=v; el.classList.remove("empty"); } else { el.textContent="（未登録）"; el.classList.add("empty"); } }

const SORT_OPTS=[["created_desc","登録日（新しい順）"],["created_asc","登録日（古い順）"],["alpha","アルファベット順 (A→Z)"],["studied_desc","学習日（新しい順）"]];
function controlsHTML(){
  const b=`<div class="lc">
    <button class="lcbtn ${(!favOnly&&!archMode)?'on':''}" data-mode="all">すべて</button>
    <button class="lcbtn ${(favOnly&&!archMode)?'on':''}" data-mode="fav">★マーク</button>
    <button class="lcbtn ${archMode?'on':''}" data-mode="arch">🗄アーカイブ</button>
  </div>`;
  if(archMode) return b;
  const opts=SORT_OPTS.map(o=>`<option value="${o[0]}"${o[0]===sortMode?" selected":""}>${o[1]}</option>`).join("");
  return b+`<div class="sortbar"><select id="sortSel">${opts}</select></div>`;
}
function attachControls(){
  document.querySelectorAll(".lcbtn").forEach(btn=>btn.addEventListener("click",()=>{
    const m=btn.dataset.mode;
    if(m==="all"){ favOnly=false; archMode=false; }
    else if(m==="fav"){ favOnly=true; archMode=false; }
    else { archMode=true; }
    idx=0; render();
  }));
  const sel=$("sortSel");
  if(sel) sel.addEventListener("change",()=>{ sortMode=sel.value; localStorage.setItem(SORT_KEY,sortMode); render(); });
}

function renderList(list){
  const lv=$("listView");
  const sorted=sortList(list);
  lv.innerHTML=controlsHTML();
  if(sorted.length===0){ lv.innerHTML+='<div class="empty-state"><div class="big">📚</div><p>該当する単語がありません。</p></div>'; attachControls(); return; }
  const hint=document.createElement("div"); hint.className="hint-sm"; hint.style.margin="0 4px 10px"; hint.textContent="← 左にスワイプでアーカイブ／タップで編集"; lv.appendChild(hint);
  sorted.forEach(c=>{
    const div=document.createElement("div");
    div.className="listitem";
    const icon=c.img?"🖼️":(c.emoji||"📄");
    div.innerHTML=`<div class="li-emoji">${icon}</div>
      <div style="flex:1; min-width:0;"><div class="li-w">${esc(c.word)}</div><div class="li-j">${esc(c.ja||"")}</div></div>
      <div class="li-star ${c.fav?'on':''}">★</div>`;
    div.querySelector(".li-star").addEventListener("click",e=>{ e.stopPropagation(); c.fav=!c.fav; save(); render(); });
    div.addEventListener("click",()=>{ if(div._swiped) return; openEdit(c.id); });
    attachSwipe(div, ()=>archiveById(c.id), null);
    lv.appendChild(div);
  });
  attachControls();
}

function renderArchive(){
  const lv=$("listView");
  lv.innerHTML=controlsHTML();
  const arr=cards.filter(c=>c.arch);
  if(arr.length===0){ lv.innerHTML+='<div class="empty-state"><div class="big">🗄</div><p>アーカイブした単語はありません。</p></div>'; attachControls(); return; }
  const note=document.createElement("div"); note.className="hint-sm"; note.style.margin="0 4px 10px"; note.textContent="↩ で復活、🗑 で完全に削除（→右スワイプで復活／←左スワイプで削除）";
  lv.appendChild(note);
  arr.forEach(c=>{
    const div=document.createElement("div");
    div.className="listitem";
    const icon=c.img?"🖼️":(c.emoji||"📄");
    div.innerHTML=`<div class="li-emoji">${icon}</div>
      <div style="flex:1; min-width:0;"><div class="li-w">${esc(c.word)}</div><div class="li-j">${esc(c.ja||"")}</div></div>
      <div class="li-act" title="復活">↩</div>
      <div class="li-act" title="完全に削除">🗑</div>`;
    const acts=div.querySelectorAll(".li-act");
    acts[0].addEventListener("click",e=>{ e.stopPropagation(); c.arch=false; save(); render(); });
    acts[1].addEventListener("click",e=>{ e.stopPropagation(); deleteById(c.id); });
    div.addEventListener("click",()=>{ if(div._swiped) return; openEdit(c.id); });
    attachSwipe(div, ()=>{ deleteById(c.id); render(); }, ()=>{ c.arch=false; save(); render(); });
    lv.appendChild(div);
  });
  attachControls();
}

function archiveById(id){ const c=cards.find(x=>x.id===id); if(!c) return; c.arch=true; if(idx>0) idx--; save(); render(); }
function deleteById(id){ const c=cards.find(x=>x.id===id); if(!c) return; if(!confirm("「"+c.word+"」を完全に削除しますか？（元に戻せません）")) return; cards=cards.filter(x=>x.id!==id); save(); render(); }
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function attachSwipe(el,onLeft,onRight){
  let x0=0,dx=0,on=false;
  el.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; dx=0; on=true; el.style.transition="none"; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!on) return; dx=e.touches[0].clientX-x0; el.style.transform="translateX("+dx+"px)"; },{passive:true});
  el.addEventListener("touchend",()=>{
    on=false; el.style.transition="transform .2s ease";
    if(Math.abs(dx)>10) el._swiped=true; setTimeout(()=>el._swiped=false,300);
    if(dx<-80 && onLeft){ el.style.transform="translateX(-110%)"; setTimeout(onLeft,160); }
    else if(dx>80 && onRight){ el.style.transform="translateX(110%)"; setTimeout(onRight,160); }
    else el.style.transform="translateX(0)";
  },{passive:true});
}

function next(){ const l=view(); if(l.length){ idx=(idx+1)%l.length; render(); } }
function prev(){ const l=view(); if(l.length){ idx=(idx-1+l.length)%l.length; render(); } }

/* ===== 追加/編集シート ===== */
const FIELDS=["inWord","inJa","inMemo","inImg","inPos","inEty","inSyn","inIdiom","inEx"];
let lastFetched="";
function openAdd(){
  editId=null; $("sheetTitle").textContent="単語を追加";
  FIELDS.forEach(i=>$(i).value="");
  lastFetched="";
  $("fetchStatus").textContent="英単語を入力すると、発音・語源・類似語・例文・画像を自動取得します。";
  $("imgPreview").classList.remove("show");

}
function openEdit(id){
  const c=cards.find(x=>x.id===id); if(!c) return;
  editId=id; $("sheetTitle").textContent="単語を編集";
  $("inWord").value=c.word||""; $("inJa").value=c.ja||""; $("inMemo").value=c.memo||""; $("inImg").value=c.img||"";
  $("inPos").value=c.pos||""; $("inEty").value=c.ety||""; $("inSyn").value=c.syn||""; $("inIdiom").value=c.idiom||""; $("inEx").value=c.ex||"";
  lastFetched=(c.word||"").toLowerCase();
  $("fetchStatus").textContent="";

  $("overlay").classList.add("show");
}
function closeSheet(){ $("overlay").classList.remove("show"); }

function saveCard(){
  const word=$("inWord").value.trim();
  const ja=$("inJa").value.trim();
  if(!word){ alert("英単語を入力してください"); return; }
  if(!ja){ if(!confirm("日本語の意味が未入力です。このまま保存しますか？")) return; }
  const data={ word, ja, memo:$("inMemo").value.trim(), img:$("inImg").value.trim(),
    pos:$("inPos").value.trim(), ety:$("inEty").value.trim(), syn:$("inSyn").value.trim(),
    idiom:$("inIdiom").value.trim(), ex:$("inEx").value.trim() };
  if(editId){ const c=cards.find(x=>x.id===editId); Object.assign(c,data); }
  else { data.id=uid(); data.fav=false; data.arch=false; data.createdAt=Date.now(); data.lastStudied=null; cards.unshift(data); idx=0; favOnly=false; archMode=false; }
  save(); closeSheet(); render();
}

/* ===== 自動取得（ボタンなし） ===== */
async function fetchWordInfo(w){
  const info={pos:"",ety:"",syn:"",ex:"",img:""};
  try{
    const dr=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
    if(dr.ok){
      const dj=await dr.json(); let phon="", ex="", defs=[], syns=[];
      for(const e of dj){
        if(!phon){ if(e.phonetic) phon=e.phonetic; else if(e.phonetics){ const p=e.phonetics.find(x=>x.text); if(p) phon=p.text; } }
        for(const m of (e.meanings||[])){
          if(m.synonyms) syns=syns.concat(m.synonyms);
          for(const d of (m.definitions||[])){ if(d.definition) defs.push(d.definition); if(!ex&&d.example) ex=d.example; if(d.synonyms) syns=syns.concat(d.synonyms); }
        }
      }
      info.pos=phon; if(defs[0]) info.ety=defs.slice(0,2).join(" / "); info.syn=[...new Set(syns)].slice(0,8).join(", "); info.ex=ex;
    }
  }catch(e){}
  try{
    const ov=await fetch("https://api.openverse.org/v1/images/?q="+encodeURIComponent(w)+"&page_size=1");
    if(ov.ok){ const oj=await ov.json(); const r0=oj.results&&oj.results[0]; const src=r0&&(r0.thumbnail||r0.url); if(src) info.img=src; }
  }catch(e){}
  if(!info.img){
    try{
      const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=500&redirects=1&titles="+encodeURIComponent(w));
      if(r.ok){ const d=await r.json(); const pages=d.query&&d.query.pages; for(const k in (pages||{})){ const th=pages[k].thumbnail; if(th&&th.source) info.img=th.source; } }
    }catch(e){}
  }
  return info;
}
function setIfEmpty(id,val){ if(val && !$(id).value.trim()){ $(id).value=val; return true; } return false; }

async function autoFillFromWord(){
  const w=$("inWord").value.trim();
  if(!w || w.toLowerCase()===lastFetched) return;
  lastFetched=w.toLowerCase();
  $("fetchStatus").textContent="自動取得中…";
  const info=await fetchWordInfo(w);
  setIfEmpty("inPos",info.pos); setIfEmpty("inEty",info.ety); setIfEmpty("inSyn",info.syn); setIfEmpty("inEx",info.ex);
  if(!$("inImg").value.trim() && info.img){ $("inImg").value=info.img; updatePreview(); }
  $("fetchStatus").textContent="✓ 自動取得しました（意味は手入力してください）";
}
function updatePreview(){ const u=$("inImg").value.trim(); const p=$("imgPreview"); if(u){ p.src=u; p.classList.add("show"); } else p.classList.remove("show"); }

/* ===== 写真から取り込み（OCR） ===== */
const JP_RE=/[぀-ヿ㐀-鿿ｦ-ﾟ々ー]/;
const UI_NOISE=/^(day\s*\d+|part\s*\d+.*|.*level.*|単語|例文|復習.*|.*聞き流し.*|.*設定.*|.*再生.*|\d+\s*分.*)$/i;
const JA_CHARS="\\u3040-\\u30ff\\u3400-\\u9fff\\uff66-\\uff9f\\u301c\\uff5e々ー";
function firstEnToken(s){ const t=(s||"").replace(/\s+/g,""); const m=t.match(/[A-Za-z][A-Za-z'\-]*/); return (m&&m[0].length>=2)?m[0]:""; }
function cleanJa(s){
  let t=(s||"").replace(/[ 　]+/g,"");
  t=t.replace(/[~∼〜～]/g,"～");
  t=t.replace(/^[ロﾛ口回日員]+(?=[^\s])/,"");
  t=t.replace(new RegExp("^[^"+JA_CHARS+"]+"),"");
  t=t.replace(/^(名詞|動詞|形容詞|副詞|名|動|形|副|前|接|代|他|自|助|句|熟|冠|間)(?=[぀-ヿ㐀-鿿])/,"");
  t=t.replace(new RegExp("[^"+JA_CHARS+"、。，・「」『』）)]+$"),"");
  return t.trim();
}
function parseOCR(text){
  const lines=text.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  const out=[]; let pendingEn=null;
  for(const l of lines){
    if(UI_NOISE.test(l)) continue;
    const hasJa=JP_RE.test(l), hasEn=/[A-Za-z]/.test(l);
    if(hasEn&&hasJa){ const m=l.search(JP_RE); const en=firstEnToken(l.slice(0,m)); const ja=cleanJa(l.slice(m)); if(en){ out.push(en+" ＝ "+ja); pendingEn=null; } continue; }
    if(hasEn){ const en=firstEnToken(l); if(en){ if(pendingEn) out.push(pendingEn+" ＝ "); pendingEn=en; } continue; }
    if(hasJa){ const ja=cleanJa(l); if(!ja) continue; if(pendingEn){ out.push(pendingEn+" ＝ "+ja); pendingEn=null; } }
  }
  if(pendingEn) out.push(pendingEn+" ＝ ");
  return out.join("\n");
}

function openImport(){ $("impFile").value=""; $("impText").value=""; $("impStatus").textContent=""; $("impPreview").style.display="none"; $("impPreview").removeAttribute("src"); $("importOverlay").classList.add("show"); }
function closeImport(){ $("importOverlay").classList.remove("show"); }

function loadImage(file){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
function toJpeg(img){
  const maxW=1600, scale=Math.min(1, maxW/(img.width||maxW));
  const w=Math.round((img.width||maxW)*scale), h=Math.round((img.height||1000)*scale);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
  return new Promise(res=>cv.toBlob(b=>res(b),"image/jpeg",0.9));
}
async function ocrSpace(blob,key){
  const fd=new FormData(); fd.append("file",blob,"image.jpg"); fd.append("language","jpn");
  fd.append("isOverlayRequired","false"); fd.append("scale","true"); fd.append("apikey",key);
  const r=await fetch("https://api.ocr.space/parse/image",{method:"POST",body:fd});
  const j=await r.json();
  if(j.IsErroredOnProcessing) throw new Error((j.ErrorMessage&&j.ErrorMessage[0])||"OCR処理エラー");
  return (j.ParsedResults&&j.ParsedResults[0]&&j.ParsedResults[0].ParsedText)||"";
}
async function runTesseract(file){
  if(typeof Tesseract==="undefined") throw new Error("OCR未読込");
  let src=file; try{ const img=await loadImage(file); const cv=document.createElement("canvas"); const sc=Math.min(3,Math.max(1.5,1800/(img.width||1000))); cv.width=Math.round((img.width||1000)*sc); cv.height=Math.round((img.height||1000)*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); src=cv; }catch(e){}
  const {data:{text}}=await Tesseract.recognize(src,"eng+jpn",{logger:m=>{ if(m.status==="recognizing text") $("impStatus").textContent="（予備OCR）読み取り中… "+Math.round((m.progress||0)*100)+"%"; }});
  return text;
}
async function runOCR(file){
  if(!file) return;
  const key=localStorage.getItem(OCRKEY_KEY)||"";
  const useKey=key||"helloworld";
  $("impStatus").textContent="読み取り中…";
  let text="";
  try{ let blob=file; try{ blob=await toJpeg(await loadImage(file)); }catch(e){} text=await ocrSpace(blob,useKey); }
  catch(e){ $("impStatus").textContent="再試行中…"; try{ text=await runTesseract(file); }catch(e2){ $("impStatus").textContent="読み取りに失敗しました。別の画像でお試しください。"; return; } }
  const parsed=parseOCR(text);
  $("impText").value=parsed||(text||"").trim();
  $("impStatus").textContent=parsed?"✓ 読み取り完了。確認・修正して「リストに追加」を押してください。":"ペアを自動抽出できませんでした。1行ずつ「英単語 ＝ 日本語」に整えてください。";
}

function splitPair(line){
  let l=line.trim(), sep=null;
  if(l.includes("\t")) sep="\t"; else if(l.includes("＝")) sep="＝"; else if(l.includes("=")) sep="="; else if(l.includes(",")) sep=",";
  if(sep){ const i=l.indexOf(sep); return [l.slice(0,i).trim(), l.slice(i+sep.length).trim()]; }
  const m=l.search(JP_RE); if(m>0) return [l.slice(0,m).trim(), l.slice(m).trim()];
  return [l.trim(), ""];
}
async function commitImport(){
  const lines=$("impText").value.split(/\r?\n/);
  let added=0, restored=0, dup=0; const newCards=[];
  lines.forEach(line=>{
    if(!line.trim()) return;
    let [en,ja]=splitPair(line); en=(en||"").trim(); ja=(ja||"").trim();
    if(!en) return;
    const ex=cards.find(c=>(c.word||"").toLowerCase()===en.toLowerCase());
    if(ex){ if(ex.arch){ ex.arch=false; if(ja&&!ex.ja) ex.ja=ja; restored++; } else dup++; }
    else { const c={id:uid(), word:en, ja:ja, fav:false, arch:false, createdAt:Date.now(), lastStudied:null}; cards.unshift(c); newCards.push(c); added++; }
  });
  save(); closeImport(); listMode=false; archMode=false; favOnly=false; idx=0; render();
  alert("追加: "+added+" 件\n復活: "+restored+" 件\n既存のためスキップ: "+dup+" 件");
  // 追加分の発音・語源・類似語・例文・画像を自動補完（バックグラウンド）
  for(const c of newCards){
    try{ const info=await fetchWordInfo(c.word);
      if(!c.pos) c.pos=info.pos; if(!c.ety) c.ety=info.ety; if(!c.syn) c.syn=info.syn; if(!c.ex) c.ex=info.ex; if(!c.img) c.img=info.img;
      save(); render();
    }catch(e){}
  }
}

$("lkGimg").addEventListener("click",()=>{ const w=$("inWord").value.trim(); if(!w){ $("fetchStatus").textContent="先に英単語を入力してください"; return; } window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent("image "+w),"_blank"); });

$("listBtn").addEventListener("click",()=>{ listMode=!listMode; if(!listMode) archMode=false; render(); });
$("favBtn").addEventListener("click",()=>{ favOnly=!favOnly; archMode=false; listMode=false; idx=0; render(); });
$("shuffleBtn").addEventListener("click",()=>{ for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; } idx=0; archMode=false; listMode=false; save(); render(); });

$("impCancel").addEventListener("click",closeImport);
$("impCommit").addEventListener("click",commitImport);
$("impFile").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(f){ const p=$("impPreview"); p.src=URL.createObjectURL(f); p.style.display="block"; }
  runOCR(f);
});
$("importOverlay").addEventListener("click",e=>{ if(e.target===$("importOverlay")) closeImport(); });
$("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) closeSheet(); });

let sx=0;
document.querySelector(".scene").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.querySelector(".scene").addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60){ dx<0?next():prev(); } });

load(); render();
